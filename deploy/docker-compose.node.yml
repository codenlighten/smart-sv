# Per-droplet stack: one SmartSV node + a Caddy TLS reverse proxy.
# Used on each cloud host (seed or peer). Role/config comes from node.env
# (SMARTSV_*) and the project .env (DOMAIN), both written by cloud-init.
#
# Run from this directory:  docker compose -f docker-compose.node.yml up -d --build

version: "3.8"

services:
  node:
    build:
      context: ..
      dockerfile: Dockerfile
    image: smartsv:local
    restart: unless-stopped
    env_file:
      - node.env
    volumes:
      - node-data:/data
    ports:
      - "8433:8433" # P2P, public
    networks: [smartsv]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8432/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
      UPSTREAM: node:8432
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on: [node]
    networks: [smartsv]

networks:
  smartsv:

volumes:
  node-data:
  caddy-data:
  caddy-config:
