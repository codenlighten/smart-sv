name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Clean, reproducible install from the lockfile. better-sqlite3 resolves a
      # prebuilt binary on the runner; build tools are present as a fallback.
      - name: Install dependencies
        run: npm ci

      # Runs all five suites: e2e, persist, reorg, p2p, p2p-reorg (70 checks).
      - name: Run test suite
        run: npm test
