name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Clean, reproducible install from the lockfile. better-sqlite3 resolves a
      # prebuilt binary on the runner; build tools are present as a fallback.
      - name: Install dependencies
        run: npm ci

      # Runs all five suites: e2e, persist, reorg, p2p, p2p-reorg (70 checks).
      - name: Run test suite
        run: npm test

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build the production image (multi-stage, compiles better-sqlite3).
      # Loaded into the local daemon so the smoke test can run it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smartsv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the node and confirm it serves and reports a valid chain.
      - name: Smoke test
        run: |
          docker run -d --name smartsv-ci -e SMARTSV_API_KEY=ci -p 8432:8432 smartsv:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8432/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "health:" && curl -fsS http://127.0.0.1:8432/health
          echo "ready:"  && curl -fsS http://127.0.0.1:8432/ready
          echo "info:"   && curl -fsS http://127.0.0.1:8432/info
          # Assert genesis height is present (node loaded its chainstate).
          curl -fsS http://127.0.0.1:8432/info | grep -q '"height": 0'

      - name: Container logs on failure
        if: failure()
        run: docker logs smartsv-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f smartsv-ci || true
